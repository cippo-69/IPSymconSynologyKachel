<style>
:root {
  --sy-bg: rgba(0,0,0,.045);
  --sy-bg2: rgba(0,0,0,.075);
  --sy-line: rgba(0,0,0,.12);
  --sy-muted: rgba(0,0,0,.52);
  --sy-top: 58px;          /* Platz für Titel und Vergrößern-Symbol der Symcon-Kachel */
}
/* Farben aus dem Modul „Visu Design“ (--w5-*); die Werte nach dem Komma gelten ohne Design-Instanz */
body {
  --sy-accent: var(--w5-accent, #2F6B4F);
  --sy-ok: var(--w5-accent, #2F6B4F);
  --sy-warn: var(--w5-warn, #9A5200);
  --sy-bad: var(--w5-alarm, #C8321F);
  --sy-on: var(--w5-on, #fff);
  --sy-fg: var(--w5-fg, #1E2224);
}
body.dark {
  --sy-accent: var(--w5-accent, #74B892);
  --sy-ok: var(--w5-accent, #74B892);
  --sy-warn: var(--w5-warn, #EE9A45);
  --sy-bad: var(--w5-alarm, #FF5A47);
  --sy-on: var(--w5-on, #1E2224);
  --sy-fg: var(--w5-fg, #F1F0EB);
  --sy-bg: rgba(255,255,255,.10);
  --sy-bg2: rgba(255,255,255,.15);
  --sy-line: rgba(255,255,255,.16);
  --sy-muted: rgba(255,255,255,.6);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body { font-family: 'Poppins', 'Work Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 14px; line-height: 1.35; }
button { font: inherit; color: var(--sy-fg); }
#sy, #sy div, #sy span, #sy b, #sy summary { color: var(--sy-fg); }
#sy .lbl, #sy .sub, #sy .facts, #sy .facts span, #sy .kv span, #sy .hint, #sy .meta { color: var(--sy-muted); }
#sy .badge, #sy .btn.solid, #sy .btn2.solid { color: var(--sy-on); }
#sy .badge.warn { color: var(--sy-on); }
#sy { position: absolute; inset: 0; padding: var(--sy-top) 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.lbl { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }

.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.st { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.st .v { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 500; line-height: 1.1; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--sy-muted); }
.dot.ok { background: var(--sy-ok); box-shadow: 0 0 0 4px rgba(116,184,146,.25); }
.dot.bad { background: var(--sy-bad); box-shadow: 0 0 0 4px rgba(255,90,71,.25); }
.dot.warn { background: var(--sy-warn); }
.dot.busy { background: var(--sy-warn); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.sub { font-size: 12px; }
.facts { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; text-align: right; flex: none; }
.facts b { font-weight: 600; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 11px; font-weight: 600; letter-spacing: .03em; padding: 3px 9px; border-radius: 999px; background: var(--sy-bad); }
.badge.warn { background: var(--sy-warn); }

.card { background: var(--sy-bg); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.card.alarm { background: rgba(255,90,71,.16); border: 1px solid var(--sy-bad); }
.card.alarm.l1 { background: rgba(238,154,69,.16); border-color: var(--sy-warn); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
.row .t { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.row .t b { font-weight: 500; }
.card .row + .row { border-top: 1px solid var(--sy-line); padding-top: 10px; }

.tg { position: relative; width: 56px; height: 32px; border-radius: 16px; background: var(--sy-line); border: 0; cursor: pointer; padding: 0; flex: none; touch-action: manipulation; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.tg.on { background: var(--sy-accent); }
.tg.on::after { left: 27px; }
.tg.rec.on { background: var(--sy-bad); }
.tg:disabled { opacity: .45; cursor: default; }

/* Balken */
.bar { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 12px; }
.bar .tr { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--sy-line); overflow: hidden; }
.bar .tr i { display: block; height: 100%; background: var(--sy-accent); }
.bar .tr i.warn { background: var(--sy-warn); }
.bar .tr i.bad { background: var(--sy-bad); }
.bar b { font-weight: 500; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 10px; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
.kv b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hint { font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 12px; border-radius: 999px; background: var(--sy-bg2); flex: none; white-space: nowrap; }
.chip .dot { width: 9px; height: 9px; }
.meta { font-size: 11px; }

.btn { min-height: 40px; border: 1px solid var(--sy-bad); background: none; border-radius: 999px; padding: 6px 16px; cursor: pointer; font-weight: 600; font-size: 13px; touch-action: manipulation; flex: none; }
#sy .btn { color: var(--sy-bad); }
.btn.solid { background: var(--sy-bad); }
#sy .btn.solid { color: var(--sy-on); }
.btn.plain { border-color: var(--sy-line); }
#sy .btn.plain { color: var(--sy-fg); }
.btn:disabled { opacity: .45; cursor: default; }
.btn2 { min-height: 38px; border: 1px solid var(--sy-accent); background: none; border-radius: 999px; padding: 4px 14px; cursor: pointer; font-weight: 600; font-size: 13px; touch-action: manipulation; text-decoration: none; display: inline-flex; align-items: center; }
#sy .btn2 { color: var(--sy-accent); }
.btn2.solid { background: var(--sy-accent); }
.pwrow { display: flex; gap: 8px; align-items: center; }
.pwrow input { flex: 1; min-width: 0; font: inherit; font-size: 16px; min-height: 42px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--sy-line); background: var(--sy-bg2); color: var(--sy-fg); }
.pwrow input:focus { outline: none; border-color: var(--sy-bad); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.toast { font-size: 12px; padding: 8px 12px; border-radius: 10px; background: var(--sy-bg2); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.lnk { border: 0; background: none; cursor: pointer; font-size: 12px; padding: 4px; }
#sy .lnk { color: var(--sy-muted); }
details summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "▾"; font-size: 12px; }
details[open] summary::after { content: "▴"; }
details .kv { margin-top: 10px; }

@media (max-width: 420px) {
  #sy { padding-left: 12px; padding-right: 12px; }
  .st .v { font-size: 22px; }
  .card { padding: 12px; }
}
body.compact #sy { gap: 8px; padding-bottom: 8px; }
body.compact .more { display: none; }
body.compact .st .v { font-size: 20px; }
body.compact .card { padding: 8px 12px; gap: 6px; }
</style>
<div id="sy"></div>
<script>
// confirm: '' | 'reboot' | 'shutdown'; open: aufgeklappte Abschnitte (bleiben beim Neuzeichnen offen)
// busy: Passwortfeld hat den Fokus, dann nicht neu zeichnen (Eingabe ginge verloren)
var SY = { s: null, confirm: '', confirmT: 0, arm: 0, offset: 0, open: {}, sent: {}, busy: false, pending: false };

/* Farben aus „Visu Design“ live übernehmen (Element #w5d), auch wenn die Visu die Kachel zwischengespeichert hat */
function design(css) {
  if (typeof css !== 'string') return;
  var st = document.getElementById('w5d');
  if (!st) { st = document.createElement('style'); st.id = 'w5d'; (document.head || document.body).appendChild(st); }
  if (st.textContent !== css) st.textContent = css;
}

function handleMessage(data) {
  try { SY.s = typeof data === 'string' ? JSON.parse(data) : data; } catch (e) { return; }
  design(SY.s.design);
  if (SY.s && SY.s.now) SY.offset = SY.s.now * 1000 - Date.now();
  SY.sent = {};
  if (SY.busy) { SY.pending = true; return; }
  render();
}
function endConfirm() { SY.confirm = ''; SY.busy = false; SY.pending = false; clearTimeout(SY.confirmT); render(); }
function armExpire() { clearTimeout(SY.confirmT); SY.confirmT = setTimeout(endConfirm, 60000); }
function send(ident, value) { if (typeof requestAction === 'function') requestAction(ident, value); }
function esc(t) { return String(t === null || t === undefined ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function now() { return Math.floor((Date.now() + SY.offset) / 1000); }
function at(ts) {
  if (!ts) return '';
  var d = new Date(ts * 1000), same = d.toDateString() === new Date().toDateString();
  return (same ? '' : pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '. ') + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function num(v, d) { return v === null || v === undefined || v === '' ? '–' : Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function dur(sec) {
  if (sec === null || sec === undefined) return '–';
  var d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return d > 0 ? d + ' T ' + h + ' h' : h > 0 ? h + ' h ' + m + ' min' : m + ' min';
}
function bytes(b) {
  if (b === null || b === undefined) return '–';
  var u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'], i = 0; b = Number(b);
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return num(b, b < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
}
function rate(b) { return b === null || b === undefined ? '–' : bytes(b) + '/s'; }
function bar(label, pct, right, warnAt, badAt) {
  var p = pct === null || pct === undefined ? 0 : Math.max(0, Math.min(100, pct));
  var cls = badAt && p >= badAt ? 'bad' : warnAt && p >= warnAt ? 'warn' : '';
  return '<div class="bar"><span>' + label + '</span><b>' + right + '</b><div class="tr"><i class="' + cls + '" style="width:' + p + '%"></i></div></div>';
}
function good(st) { st = String(st || '').toLowerCase(); return st === '' || st === 'normal' || st === 'ok' || st === 'running' || st === 'initialized'; }
function stTxt(st) {
  var m = { normal: 'normal', degraded: 'beeinträchtigt', crashed: 'abgestürzt', warning: 'Warnung', abnormal: 'auffällig', failing: 'fällt aus', not_use: 'nicht benutzt', initialized: 'bereit' };
  return m[String(st).toLowerCase()] || st || '–';
}
function raidTxt(r) {
  var m = /^shr_with_(\d)_disks?_protect$/.exec(r);
  if (m) return 'SHR · ' + m[1] + ' Laufwerk' + (m[1] === '1' ? '' : 'e') + ' Ausfallschutz';
  if (r === 'shr_without_disk_protect') return 'SHR · ohne Ausfallschutz';
  return r.toUpperCase().replace(/_/g, ' ');
}
function upsTxt(st) {
  st = String(st || '').toLowerCase();
  if (st.indexOf('lowbatt') >= 0) return 'Batterie schwach';
  if (st.indexOf('onbatt') >= 0 || st.indexOf('battery') >= 0) return 'Batteriebetrieb';
  if (st.indexOf('online') >= 0) return 'Netzbetrieb';
  if (st.indexOf('nodevice') >= 0 || st.indexOf('none') >= 0) return 'keine USV';
  return st.replace(/^usb_ups_status_/, '') || '–';
}

function theme() {
  var b = document.body, m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(getComputedStyle(b).color || ''), dark;
  if (m) dark = (0.2126 * m[1] + 0.7152 * m[2] + 0.0722 * m[3]) / 255 > 0.5;
  else dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  b.classList.toggle('dark', dark);
}

/* Neustart/Herunterfahren: nur mit Passwort. Bestätigen-Knopf erst nach 3 s aktiv, Rückfrage verfällt nach 60 s ohne Eingabe */
function sysRow(key, title, info, warn, label) {
  var s = SY.s, locked = s.pwLock && s.pwLock > now();
  if (!s.pwSet) info = 'Gesperrt: kein Passwort eingerichtet (Instanz-Konfiguration).';
  else if (locked) info = 'Nach Fehlversuchen gesperrt bis ' + at(s.pwLock) + '.';
  var h = '<div class="row"><div class="t"><b>' + title + '</b><span class="sub">' + (SY.confirm === key ? warn : info) + '</span></div>';
  if (SY.confirm === key) {
    h += '<button class="btn plain" data-no="1">Abbrechen</button></div>';
    var wait = Math.max(0, 3 - Math.floor((Date.now() - SY.arm) / 1000));
    h += '<div class="pwrow"><input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Passwort" aria-label="Passwort für ' + title + '">'
      + '<button class="btn solid" data-yes="' + key + '" id="yes"' + (wait ? ' disabled' : '') + '>' + label + (wait ? ' (' + wait + ')' : '') + '</button></div>';
    return h;
  }
  h += '<button class="btn" data-ask="' + key + '"' + (!s.pwSet || locked ? ' disabled' : '') + '>' + label + '</button>';
  return h + '</div>';
}
var SHUT_WARN = 'Auch IP-Symcon läuft auf dieser NAS und ist danach aus. Einschalten nur am Gerät (oder Wake-on-LAN).';

function render() {
  var s = SY.s, el = document.getElementById('sy');
  if (!s) return;
  theme();
  document.body.classList.toggle('compact', window.innerHeight < 300);
  if (s.error) { el.innerHTML = '<div class="hint">' + esc(s.error) + '</div>'; return; }
  var x = s.x || {}, xs = x.sys || {}, ut = x.util || {}, sy = s.sys, u = s.ups, h = '';

  // Kopf
  var on = sy.online === true, cls = on ? 'ok' : sy.online === false ? 'bad' : '';
  var model = [xs.model, sy.fw || xs.fw].filter(Boolean).join(' · ');
  var cpu = ut.cpu !== undefined && ut.cpu !== null ? ut.cpu : sy.cpu;
  var mem = ut.mem !== undefined && ut.mem !== null ? ut.mem : sy.mem;
  h += '<div class="head"><div class="st"><div class="v"><span class="dot ' + cls + '"></span>' + (on ? 'Online' : sy.online === false ? 'Offline' : 'Unbekannt') + '</div>'
    + '<div class="sub">' + esc(model) + (sy.since ? ' · seit ' + at(sy.since) : '') + '</div></div>'
    + '<div class="facts"><span>CPU <b>' + num(cpu, 0) + ' %</b></span><span>RAM <b>' + num(mem, 0) + ' %</b></span><span><b>' + num(sy.temp !== null ? sy.temp : xs.temp, 0) + ' °C</b></span></div></div>';

  // Hinweise
  var b = '';
  if (s.io && s.io !== 102) b += '<span class="badge">' + (s.io === 202 ? 'Anmeldung fehlgeschlagen' : 'Verbindung gestört (' + s.io + ')') + '</span>';
  if (sy.crashed === true) b += '<span class="badge">Systemabsturz</span>';
  if (xs.tempWarn) b += '<span class="badge">Temperatur zu hoch</span>';
  if (sy.upgrade === true || (x.upgrade && x.upgrade.available)) b += '<span class="badge warn">DSM-Update' + (x.upgrade && x.upgrade.version ? ' ' + esc(x.upgrade.version) : '') + '</span>';
  (s.storage || []).forEach(function (v) { if (typeof v.value === 'string' && !good(v.value)) b += '<span class="badge">' + esc(v.name.replace(/:.*/, '')) + ': ' + esc(stTxt(v.value)) + '</span>'; });
  (x.disks || []).forEach(function (d) { if (!good(d.status) || !good(d.smart)) b += '<span class="badge">' + esc(d.name) + ': ' + esc(stTxt(!good(d.status) ? d.status : d.smart)) + '</span>'; });
  (s.cams || []).forEach(function (c) { if (c.state !== 1 && c.state !== 7) b += '<span class="badge">Kamera ' + esc(c.name) + ': ' + esc(c.fmt) + '</span>'; });
  if (u && (u.ups === false || u.nas === false)) b += '<span class="badge warn">USV nicht verbunden</span>';
  if (b) h += '<div class="badges">' + b + '</div>';

  // USV-Alarm mit Herunterfahren
  if (u && u.level > 0) {
    h += '<div class="card alarm' + (u.level === 1 ? ' l1' : '') + '"><div class="row"><div class="t"><span class="lbl">' + (u.level === 2 ? 'USV kritisch' : 'Stromausfall') + '</span>'
      + '<b>' + upsTxt(u.state) + ' seit ' + at(u.alarmSince) + '</b></div><span class="chip"><span class="dot ' + (u.level === 2 ? 'bad' : 'busy') + '"></span>' + num(u.charge, 0) + ' % · ' + num(u.runtime, 0) + ' min</span></div>'
      + '<div class="hint">' + (u.level === 2 ? 'Ladestand unter ' + u.lowCharge + ' % oder Restlaufzeit unter ' + u.lowRuntime + ' min. NAS jetzt geordnet herunterfahren.' : 'Die NAS läuft über die USV. Bei weiter sinkendem Ladestand herunterfahren.') + '</div>';
    if (s.canShutdown) h += sysRow('shutdown', 'NAS herunterfahren', 'Fährt DSM geordnet herunter.', SHUT_WARN, 'Herunterfahren');
    h += '</div>';
  }

  // Ergebnis der letzten Aktion (60 s)
  if (s.action && s.action.ts && now() - s.action.ts < 60) {
    h += '<div class="toast"><span>' + esc(s.action.name) + ': ' + (s.action.ok ? 'ausgeführt' : esc(s.action.msg || 'fehlgeschlagen')) + ' (' + at(s.action.ts) + ')</span><button class="lnk" data-dismiss="1">✕</button></div>';
  }

  // System
  var memTxt = ut.memTotal ? bytes(ut.memTotal - (ut.memAvail || 0)) + ' von ' + bytes(ut.memTotal) : num(mem, 0) + ' %';
  h += '<div class="card more"><span class="lbl">System</span><div class="bars">'
    + bar('CPU' + (ut.cpu !== undefined && ut.cpu !== null ? '' : ' (5 min)'), cpu, num(cpu, 0) + ' %', 70, 90)
    + bar('Arbeitsspeicher', mem, memTxt, 80, 95)
    + (ut.disk !== undefined && ut.disk !== null ? bar('Datenträger-Auslastung', ut.disk, num(ut.disk, 0) + ' %', 70, 90) : '')
    + '</div><div class="kv">'
    + '<span>Netzwerk ↓ / ↑</span><b>' + (ut.rx !== undefined && ut.rx !== null ? rate(ut.rx) + ' / ' + rate(ut.tx) : num(sy.rx, 1) + ' / ' + num(sy.tx, 1) + ' MB/s') + '</b>'
    + '<span>Laufzeit</span><b>' + (xs.uptime ? dur(xs.uptime) : dur((sy.uptimeH || 0) * 3600)) + '</b>'
    + '<span>Temperatur</span><b>' + num(sy.temp !== null ? sy.temp : xs.temp, 0) + ' °C</b>'
    + (xs.cpu ? '<span>Prozessor</span><b>' + esc(xs.cpu) + (xs.cores ? ' · ' + xs.cores + ' Kerne' : '') + (xs.clock ? ' · ' + num(xs.clock / 1000, 1) + ' GHz' : '') + '</b>' : '')
    + (xs.ram ? '<span>RAM</span><b>' + num(xs.ram / 1024, 0) + ' GB</b>' : '')
    + '<span>DSM</span><b>' + esc(sy.fw || xs.fw || '–') + (xs.fwDate ? ' (' + esc(xs.fwDate) + ')' : '') + '</b>'
    + '<span>Update</span><b>' + (sy.upgrade === true || (x.upgrade && x.upgrade.available) ? 'verfügbar' + (x.upgrade && x.upgrade.version ? ': ' + esc(x.upgrade.version) : '') : 'aktuell') + '</b>'
    + '<span>Systemabsturz</span><b>' + (sy.crashed ? 'ja' : 'nein') + '</b>'
    + '</div></div>';

  // Speicher
  if (s.storage || x.volumes) {
    h += '<div class="card more"><span class="lbl">Speicher</span>';
    if (x.volumes && x.volumes.length) {
      h += '<div class="bars">';
      x.volumes.forEach(function (v) {
        var p = v.total ? v.used / v.total * 100 : null;
        h += bar(esc(v.name) + (v.fs ? ' · ' + esc(v.fs) : '') + ' · ' + esc(stTxt(v.status)), p, bytes(v.used) + ' von ' + bytes(v.total) + ' (' + num(p, 1) + ' %)', 80, 90);
      });
      h += '</div>';
    } else {
      (s.storage || []).forEach(function (v) { if (/^VolumePercent/.test(v.ident)) h += '<div class="bars">' + bar(esc(v.name), v.value, esc(v.fmt), 80, 90) + '</div>'; });
    }
    h += '<div class="kv">';
    if (x.pools && x.pools.length) x.pools.forEach(function (p) { h += '<span>Speicherpool ' + esc(p.name) + '</span><b>' + esc(stTxt(p.status)) + (p.raid ? ' · ' + esc(raidTxt(p.raid)) : '') + (p.disks ? ' · ' + p.disks + ' Laufwerke' : '') + '</b>'; });
    else (s.storage || []).forEach(function (v) { if (!/^VolumePercent/.test(v.ident)) h += '<span>' + esc(v.name) + '</span><b>' + esc(stTxt(v.fmt)) + '</b>'; });
    h += '</div>';
    (x.disks || []).forEach(function (d) {
      var ok = good(d.status) && good(d.smart);
      h += '<div class="row"><div class="t"><b>' + esc(d.name) + '</b><span class="sub">' + esc([d.model, d.type, d.size ? bytes(d.size) : ''].filter(Boolean).join(' · ')) + (d.fw ? ' · FW ' + esc(d.fw) : '') + '</span></div>'
        + '<span class="chip"><span class="dot ' + (ok ? 'ok' : 'bad') + '"></span>' + num(d.temp, 0) + ' °C · ' + esc(ok ? 'gesund' : stTxt(!good(d.status) ? d.status : d.smart)) + '</span></div>';
    });
    h += '</div>';
  }

  // Überwachung
  if (s.cams) {
    var hm = SY.sent.home !== undefined ? SY.sent.home : x.homeMode;
    h += '<div class="card more"><span class="lbl">Surveillance Station</span>';
    h += '<div class="row"><div class="t"><b>Home Mode</b><span class="sub">' + (hm === null || hm === undefined ? 'Zustand unbekannt' : hm ? 'eingeschaltet' : 'ausgeschaltet') + '</span></div>'
      + '<button class="tg' + (hm ? ' on' : '') + '" id="home" aria-label="Home Mode"' + (on ? '' : ' disabled') + '></button></div>';
    s.cams.forEach(function (c) {
      var xc = (x.cams || {})[String(c.id)] || {}, key = 'cam' + c.id;
      var rec = SY.sent[key] !== undefined ? SY.sent[key] : (xc.rec !== null && xc.rec !== undefined ? xc.rec > 0 : null);
      var ok = c.state === 1, off = c.state === 7;
      h += '<div class="row"><div class="t"><b>' + esc(c.name) + '</b><span class="sub"><span class="dot ' + (ok ? 'ok' : off ? '' : 'bad') + '" style="display:inline-block;width:8px;height:8px;margin-right:6px"></span>' + esc(c.fmt)
        + (xc.model ? ' · ' + esc(xc.model) : '') + (xc.ip ? ' · ' + esc(xc.ip) : '') + ' · ' + (rec === null ? 'Aufnahme ?' : rec ? 'nimmt auf' : 'keine Aufnahme') + '</span></div>'
        + '<button class="tg rec' + (rec ? ' on' : '') + '" data-cam="' + c.id + '" data-rec="' + (rec ? 1 : 0) + '" aria-label="Aufnahme ' + esc(c.name) + '"' + (ok && on ? '' : ' disabled') + '></button></div>';
    });
    h += '</div>';
  }

  // USV
  if (u) {
    h += '<div class="card more"><span class="lbl">USV</span><div class="bars">' + bar(upsTxt(u.state), u.charge, num(u.charge, 0) + ' %', 0, 0) + '</div><div class="kv">'
      + '<span>Restlaufzeit</span><b>' + num(u.runtime, 0) + ' min</b>'
      + '<span>Verbindung NAS / USV</span><b>' + (u.nas ? 'online' : 'offline') + ' / ' + (u.ups ? 'online' : 'offline') + '</b>'
      + (x.ups && x.ups.model ? '<span>Gerät</span><b>' + esc(x.ups.model) + '</b>' : '')
      + (x.ups && x.ups.mode ? '<span>Anschluss</span><b>' + esc(x.ups.mode) + '</b>' : '')
      + (x.ups && x.ups.enabled === false ? '<span>DSM-USV-Unterstützung</span><b>aus</b>' : '')
      + (x.ups && x.ups.enabled && x.ups.delay !== null && x.ups.delay !== undefined ? '<span>DSM-Abschaltung (Sicherheitsmodus)</span><b>' + (x.ups.delay < 0 ? 'bei Batterie schwach' : 'nach ' + x.ups.delay + ' min Batteriebetrieb') + '</b>' : '')
      + '<span>Alarm</span><b>unter ' + u.lowCharge + ' % oder ' + u.lowRuntime + ' min</b>'
      + '</div></div>';
  }

  // Pakete
  if (x.packages && x.packages.length) {
    var run = x.packages.filter(function (p) { return p.status === 'running'; }).length;
    h += '<div class="card more"><details id="pk"' + (SY.open.pk ? ' open' : '') + '><summary><span class="lbl">Pakete · ' + run + ' von ' + x.packages.length + ' laufen</span></summary><div class="kv">';
    x.packages.forEach(function (p) { h += '<span>' + esc(p.name) + '</span><b>' + esc(p.version) + ' · ' + (p.status === 'running' ? 'läuft' : p.status === 'stop' ? 'gestoppt' : esc(p.status || '–')) + '</b>'; });
    h += '</div></details></div>';
  }

  // Wartung
  h += '<div class="card more"><span class="lbl">Wartung</span>'
    + '<div class="row"><div class="t"><b>Daten</b><span class="sub">' + (x.ts ? (x.ok === false ? 'DSM antwortet nicht, zuletzt ' + at(x.lastOk) : 'abgefragt ' + at(x.ts)) : 'noch nicht abgefragt') + '</span></div>'
    + '<div class="acts"><button class="btn2" data-act="Refresh">Aktualisieren</button>' + (s.dsm ? '<a class="btn2" href="' + esc(s.dsm) + '" target="_blank" rel="noopener">DSM</a>' : '') + '</div></div>'
    + '<div class="row"><div class="t"><b>Anmeldung</b><span class="sub">Synology IO: ' + (s.io === 102 ? 'verbunden' : s.io === 202 ? 'Anmeldung fehlgeschlagen' : s.io === 201 ? 'keine Verbindung' : 'Status ' + s.io) + '</span></div>'
    + '<button class="btn2" data-act="Login">Neu anmelden</button></div>';
  if (s.canReboot) h += sysRow('reboot', 'NAS neu starten', 'Startet DSM neu (einige Minuten).', 'IP-Symcon und alle Dienste der NAS sind einige Minuten weg.', 'Neustart');
  if (s.canShutdown && !(u && u.level > 0)) h += sysRow('shutdown', 'NAS herunterfahren', 'Für Stromausfall mit leerer USV.', SHUT_WARN, 'Herunterfahren');
  h += '</div>';

  el.innerHTML = h;
  bind();
}

function bind() {
  var pk = document.getElementById('pk');
  if (pk) pk.addEventListener('toggle', function () { SY.open.pk = pk.open; });
  var hm = document.getElementById('home');
  if (hm) hm.onclick = function () { if (hm.disabled) return; var v = !hm.classList.contains('on'); SY.sent.home = v; render(); send('HomeMode', v); };
  document.querySelectorAll('[data-cam]').forEach(function (t) {
    t.onclick = function () {
      if (t.disabled) return;
      var v = t.dataset.rec !== '1';
      SY.sent['cam' + t.dataset.cam] = v; render();
      send('Record', JSON.stringify({ id: Number(t.dataset.cam), on: v }));
    };
  });
  document.querySelectorAll('[data-act]').forEach(function (b) { b.onclick = function () { b.disabled = true; send(b.dataset.act, true); }; });
  document.querySelectorAll('[data-dismiss]').forEach(function (b) { b.onclick = function () { send('DismissAction', true); }; });
  document.querySelectorAll('[data-ask]').forEach(function (b) {
    b.onclick = function () {
      if (b.disabled) return;
      SY.confirm = b.dataset.ask; SY.arm = Date.now(); render();
      armExpire();
      var p = document.getElementById('pw'); if (p) p.focus();
    };
  });
  document.querySelectorAll('[data-no]').forEach(function (b) { b.onclick = endConfirm; });
  var pw = document.getElementById('pw');
  if (pw) {
    pw.addEventListener('focus', function () { SY.busy = true; });
    pw.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement && document.activeElement.id === 'pw') return; SY.busy = false; if (SY.pending && SY.confirm === '') { SY.pending = false; render(); } }, 200); });
    pw.addEventListener('input', armExpire);
    pw.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { var y = document.getElementById('yes'); if (y) y.click(); }
      if (e.key === 'Escape') endConfirm();
    });
  }
  document.querySelectorAll('[data-yes]').forEach(function (b) {
    b.onclick = function () {
      if (b.disabled) return;
      var p = document.getElementById('pw'), v = p ? p.value : '';
      if (!v) { if (p) p.focus(); return; }
      var k = b.dataset.yes;
      if (p) p.value = '';
      send(k === 'shutdown' ? 'Shutdown' : 'Reboot', JSON.stringify({ pw: v }));
      endConfirm();
    };
  });
}

/* Countdown im Bestätigen-Knopf */
setInterval(function () {
  var y = document.getElementById('yes');
  if (!y || !SY.confirm) return;
  var wait = Math.max(0, 3 - Math.floor((Date.now() - SY.arm) / 1000));
  y.disabled = wait > 0;
  y.textContent = (SY.confirm === 'shutdown' ? 'Herunterfahren' : 'Neustart') + (wait ? ' (' + wait + ')' : '');
}, 250);
window.addEventListener('resize', function () { if (SY.s) render(); });
</script>
